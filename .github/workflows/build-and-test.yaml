name: Tests

on:
  push:
    branches: [ main ]
    paths:
    - 'src/**'
    - 'tests/**'
    - 'db-gen.slnx'
    - '.github/scripts/**'
    - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
    - 'src/**'
    - 'tests/**'
    - 'db-gen.slnx'
    - '.github/scripts/**'
    - '.github/workflows/**'
  workflow_call:
    inputs:
      commit_sha:
        description: Full source commit to build and test
        required: true
        type: string

permissions:
  contents: read

env:
  VSTEST_CONNECTION_TIMEOUT: '300'

jobs:
  build-and-test:
    name: build-and-test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v6
      if: ${{ inputs.commit_sha == '' }}

    - uses: actions/checkout@v6
      if: ${{ inputs.commit_sha != '' }}
      with:
        ref: ${{ inputs.commit_sha }}

    - name: Verify exact source commit
      if: ${{ inputs.commit_sha != '' }}
      shell: pwsh
      env:
        EXPECTED_COMMIT: ${{ inputs.commit_sha }}
      run: |
        if ($env:EXPECTED_COMMIT -cnotmatch '^[0-9a-f]{40}\z')
        {
          throw 'Expected a full lowercase commit SHA.'
        }

        $actualCommit = (git rev-parse HEAD).Trim()
        if ($LASTEXITCODE -ne 0 -or $actualCommit -cne $env:EXPECTED_COMMIT)
        {
          throw "Checked out '$actualCommit', expected '$env:EXPECTED_COMMIT'."
        }

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
            10.0.x
            9.0.x
            8.0.x

    - name: Install dependencies
      run: dotnet restore db-gen.slnx

    - name: Build
      run: dotnet build db-gen.slnx --configuration Release --no-restore

    - name: Test
      run: dotnet test db-gen.slnx --configuration Release --no-build --verbosity normal -p:TestTfmsInParallel=false
